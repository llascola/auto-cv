# With some help from: https://gist.github.com/dgerosa/2e1f47a39180f39bde848e38243efa94

name: build
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege token for the official GitHub Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 22.04 ships libssl1.1, required by the pinned Tectonic 0.14.1 binary.
    # (ubuntu-latest/24.04 dropped libssl1.1; Tectonic `latest` SIGABRTs on
    # format generation, so we pin a known-good version instead.)
    runs-on: ubuntu-22.04
    env:
      # Edit here with the names of your latex file and directory (can use ".")
      DIR: .
      FILE: cv
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Cache Tectonic packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            tectonic-${{ runner.os }}-
      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tectonic-version: 0.14.1
      - name: Build CV
        run: tectonic ${{ env.FILE }}.tex
        working-directory: ${{ env.DIR }}
      - name: Assemble site
        run: |
          mkdir -p _site
          mv ${{ env.DIR }}/${{ env.FILE }}.pdf _site/
          cp index.html _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
